name = "refill-radar-pixel"
type = "web_pixel_extension"
uid = "05e76219-0263-b967-f782-eba95a0f1defd456ce4f"

runtime_context = "strict"

# Loads only with analytics permission. It measures reminders for the merchant:
# no ads, no personalization, no data sale, and no customer fields are read.
[customer_privacy]
analytics = true
marketing = false
preferences = false
sale_of_data = "disabled"

[settings]
type = "object"

# Set by the app when it connects the pixel: the app proxy path on the shop's domain.
[settings.fields.endpoint_path]
name = "Endpoint path"
description = "App proxy path that receives the events, for example /apps/vicubites-refill/events."
type = "single_line_text_field"
validations = [
  { name = "min", value = "1" }
]
