query CartInput {
  shop {
    localTime {
      date
    }
  }
  cart {
    buyerIdentity {
      purchasingCompany {
        company {
          id
        }
      }
      customer {
        refillRunOut: metafield(namespace: "$app", key: "refill_run_out") {
          value
        }
      }
    }
    lines {
      id
      merchandise {
        __typename
        ... on ProductVariant {
          product {
            productType
          }
        }
      }
    }
  }
  discount {
    discountClasses
    config: metafield(namespace: "$app", key: "refill-reward-config") {
      jsonValue
    }
  }
}
