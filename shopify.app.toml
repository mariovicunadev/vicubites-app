# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "d313b885e5cb92bb34246ca58e433fb3"
application_url = "https://vicubites-app.vercel.app"
embedded = true
name = "vicubites-app"

[access_scopes]
# Least privilege: each feature adds only the scopes it needs.
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,write_products,read_metaobject_definitions,read_publications,read_orders,write_customers,write_pixels,read_customer_events,write_discounts,write_validations"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/bulk_operations/finish"
  topics = [ "bulk_operations/finish" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/create"
  topics = [ "orders/create" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/companies"
  topics = [ "companies/create", "companies/update", "company_contacts/create", "company_contacts/update" ]

# Refill Radar forecast, owned by the app ($app namespace). Merchants can read
# it on the customer; storefront and customer account access come with the
# surfaces that need them.
[customer.metafields.app.refill_run_out]
type = "date"
name = "Refill run-out date"
description = "Earliest date this customer's dry food is expected to run out (Refill Radar)."
access.admin = "merchant_read"

[customer.metafields.app.refill_forecast]
type = "json"
name = "Refill forecast"
description = "Refill Radar forecast per species: basis, days of food, last order and run-out dates."
access.admin = "merchant_read"

[customer.metafields.app.refill_variants]
type = "list.variant_reference"
name = "Refill last bags"
description = "Last dry food variant bought per species, for the storefront reorder button (Refill Radar)."
access.admin = "merchant_read"

[auth]
redirect_urls = [ "https://vicubites-app.vercel.app/auth/callback" ]

[build]
automatically_update_urls_on_dev = true
