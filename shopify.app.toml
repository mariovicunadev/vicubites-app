# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "d313b885e5cb92bb34246ca58e433fb3"
application_url = "https://vicubites-app.vercel.app"
embedded = true
name = "vicubites-app"

[access_scopes]
# Least privilege: each feature adds only the scopes it needs.
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,write_products,read_metaobject_definitions,read_metaobjects,read_publications,read_orders,write_orders,write_customers,write_pixels,read_customer_events,write_discounts,write_validations,write_cart_transforms,customer_read_customers"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/bulk_operations/finish"
  topics = [ "bulk_operations/finish" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/create"
  topics = [ "orders/create" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/companies"
  topics = [ "companies/create", "companies/update", "company_contacts/create", "company_contacts/update" ]

# Refill Radar forecast, owned by the app ($app namespace). Merchants can read
# it on the customer. The customer account page reads the forecast and the
# reminder choice; Liquid reads $app metafields whatever their storefront access.
[customer.metafields.app.refill_run_out]
type = "date"
name = "Refill run-out date"
description = "Earliest date any of this customer's pets is expected to run out of dry food (Refill Radar)."
access.admin = "merchant_read"

[customer.metafields.app.refill_forecast]
type = "json"
name = "Refill forecast"
description = "Refill Radar forecast per species: basis, days of food, last order and run-out dates, last variant."
access.admin = "merchant_read"
access.customer_account = "read"

[customer.metafields.app.refill_variants]
type = "list.variant_reference"
name = "Refill last bags"
description = "Last dry food bag (variant) bought for each species, used by the storefront reorder button (Refill Radar)."
access.admin = "merchant_read"

[customer.metafields.app.refill_reminders]
type = "boolean"
name = "Refill reminders"
description = "The customer's latest refill reminder choice from checkout; unset means on (Refill Radar)."
access.admin = "merchant_read"
access.customer_account = "read"

# Set in checkout as a cart metafield by the Refill Radar block and copied to
# the order when it's placed; the orders/create webhook reads it.
[order.metafields.app.refill_reminders]
type = "boolean"
name = "Refill reminders"
description = "Whether the buyer asked for refill reminders in checkout (Refill Radar)."
access.admin = "merchant_read"
capabilities.cart_to_order_copyable = true

[auth]
redirect_urls = [ "https://vicubites-app.vercel.app/auth/callback" ]

[build]
automatically_update_urls_on_dev = true
